name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($PKG)"
            exit 1
          fi

      - run: npm ci
      - run: npm run check

      - name: Build .dmg (arm64 + x64)
        run: npm run dist
        env:
          # Optional code signing: add these secrets to sign the app.
          # Without them electron-builder produces an unsigned build.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "MacSweep ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release/*.dmg release/*.dmg.blockmap release/latest-mac.yml
